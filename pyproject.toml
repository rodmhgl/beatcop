[project]
name = "beatcop"
version = "0.1.0"
description = "Beat, downbeat and tempo-map detection using the Beat This! model via ONNX Runtime"
authors = [{ name = "Rod Stewart" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "soundfile>=0.12",
    "soxr>=0.3",
    "onnxruntime>=1.18",
    "mido>=1.3",
]

[project.scripts]
beatcop = "beatcop.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
